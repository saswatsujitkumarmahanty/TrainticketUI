<header class="topbar">
  <div class="container bar-inner">
    <a routerLink="/search" class="brand">Train Ticket </a>

    <nav class="nav-links">
      <a routerLink="/search" routerLinkActive="active">Search Trains</a>
      @if (auth.isLoggedIn) {
        <a routerLink="/my-bookings" routerLinkActive="active">My Bookings</a>
      }
    </nav>

    <div class="auth-area">
      @if (auth.isLoggedIn) {
        <span class="user-name">Hi, {{ auth.fullName() }}</span>
        <button class="btn btn-outline" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" class="btn btn-outline">Login</a>
        <a routerLink="/register" class="btn btn-primary">Register</a>
      }
    </div>
  </div>
</header>
